# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

products:
  - display-name: Cli-template
    subtitle: A modern CLI template with pre-configured tools, best practices, and CI/CD setup for rapid project development.
    icon: fa-duotone fa-copy
    href: /cli-template
  - display-name: Clients
    subtitle: API clients and shared HTTP primitives.
    icon: fa-duotone fa-plug
    href: /clients
  - display-name: Configs
    subtitle: Shared configuration files.
    icon: fa-duotone fa-sliders
    href: /configs
  - display-name: Internal
    subtitle: Member-only documentation for maintaining the org's infrastructure, CI pipelines, and tooling.
    icon: fa-duotone fa-lock
    href: /internal
  - display-name: Monorepo-nextjs-template
    subtitle: A modern Next.js + React component library template for monorepos with pre-configured tools, best practices, and CI/CD setup for rapid application development.
    icon: fa-duotone fa-copy
    href: /monorepo-nextjs-template
  - display-name: Monorepo-react-template
    subtitle: A modern React component library template for monorepos with pre-configured tools, best practices, and CI/CD setup for rapid project development.
    icon: fa-duotone fa-copy
    href: /monorepo-react-template
  - display-name: Monorepo-template
    subtitle: A modern NodeJS template for monorepos with pre-configured tools, best practices, and CI/CD setup for rapid project development.
    icon: fa-duotone fa-copy
    href: /monorepo-template
  - display-name: Nextjs-template
    subtitle: A modern NextJS template with pre-configured tools, best practices, and CI/CD setup for rapid application development.
    icon: fa-duotone fa-copy
    href: /nextjs-template
  - display-name: Node-template
    subtitle: A modern NodeJS template with pre-configured tools, best practices, and CI/CD setup for rapid project development.
    icon: fa-duotone fa-copy
    href: /node-template
  - display-name: React-template
    subtitle: A modern React template with pre-configured tools, best practices, and CI/CD setup for rapid project development.
    icon: fa-duotone fa-copy
    href: /react-template
  - display-name: Skills
    subtitle: Shared agent skill registry.
    icon: fa-duotone fa-bolt
    href: /skills
  - display-name: Themes
    subtitle: Themes and design tokens.
    icon: fa-duotone fa-palette
    href: /themes
  - display-name: Utils
    subtitle: Lightweight TypeScript utility packages for arrays, strings, dates, environment detection, and more.
    icon: fa-duotone fa-toolbox
    href: /utils

instances:
  - url: holocron.docs.buildwithfern.com/themes
    custom-domain: wiki.theholocron.dev/themes
    multi-source: true

title: themes Engineering

layout:
  page-width: full
  tabs-placement: header
  searchbar-placement: header

tabs:
  decisions:
    display-name: Decisions
    icon: fa-duotone fa-scale-balanced
  standards:
    display-name: Standards
    icon: fa-duotone fa-book
  specifications:
    display-name: Specifications
    icon: fa-duotone fa-file-lines

navigation:
  - tab: decisions
    layout:
      - section: Architecture Decision Records
        contents:
          - page: Index
            path: ../docs/wiki/decisions/README.md
  - tab: standards
    layout:
      - section: Standards
        contents:
          - page: Overview
            path: ../docs/wiki/standards/README.md
  - tab: specifications
    layout:
      - section: Specifications
        contents:
          - page: Overview
            path: ../docs/wiki/specifications/README.md

colors:
  accent-primary:
    dark: "#70E155"
    light: "#008700"

logo:
  height: 20

metadata:
  og:dynamic: true
